# Cấu hình Bộ lọc Kalman Mở rộng (EKF) hợp nhất Encoder 4 bánh Mecanum + Cảm biến IMU 6 trục MPU6050
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    # Chế độ phẳng 2D loại bỏ hoàn toàn nhiễu trôi trục Z / Roll / Pitch trên sàn nhà
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # 1. Nguồn Encoder bánh xe Mecanum (/wheel/odom):
    # Chỉ lấy vận tốc tịnh tiến [vx, vy]; KHÔNG lấy góc xoay từ bánh xe để tránh sai số trượt con lăn
    # Thứ tự ma trận 15 biến:
    # [x, y, z,  roll, pitch, yaw,  vx, vy, vz,  vroll, vpitch, vyaw,  ax, ay, az]
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # 2. Nguồn Cảm biến IMU 6 trục MPU6050 (/imu/data):
    # Lấy góc hướng tương đối (yaw) và vận tốc góc trục Z (vyaw = gz) cực nhạy từ con quay hồi chuyển.
    # Lưu ý khi xuống mạch thật: nếu driver MPU6050 chỉ xuất raw gyro (không chạy DMP/Madgwick tạo quaternion),
    # hãy đổi giá trị thứ 6 (yaw) thành false và giữ nguyên vyaw = true.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
